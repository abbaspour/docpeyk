name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning docpeyk.sh findfeed.sh findtoc.sh install.sh tests/run.sh tests/stubs/* tests/stubs-web/*

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          - os: macos-latest
            bash: bash
          - os: macos-latest   # stock bash 3.2, what /usr/bin/env bash finds on a fresh Mac
            bash: /bin/bash
    name: test (${{ matrix.os }}, ${{ matrix.bash }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Ensure mikefarah/yq
        run: |
          if [[ "$(yq --version 2>&1)" != *mikefarah* ]]; then
            if [[ "${RUNNER_OS}" == macOS ]]; then
              brew install yq
            else
              sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
              sudo chmod +x /usr/local/bin/yq
            fi
          fi
          yq --version
      - run: tests/run.sh -b "${{ matrix.bash }}"
